# 테스트 전용 설정 — DB·env 없이 컨텍스트가 뜨도록 H2 in-memory와 더미 값을 쓴다. 실제 secret 아님.
spring.datasource.url=jdbc:h2:mem:bubot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.bubot
mybatis.mapper-locations=classpath:com/bubot/**/*.xml

# 외부 거래소 WebSocket 연결 차단
app.coin.websocket.enabled=false
app.stock.websocket.enabled=false

# 더미 키 (테스트 전용) — JWT HS256은 32바이트 이상, 암호화 키는 Base64 32바이트
app.jwt.secret=test-only-jwt-secret-0123456789abcdef0123456789
app.jwt.expiration-ms=3600000
app.encryption.key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
app.bot.base-url=http://localhost:3000
app.bot.api-token=test-only-token
app.bot.operator-member-id=admin
app.cors.allowed-origins=http://localhost:5174
app.upload.base=${java.io.tmpdir}/bubot-test-upload/
app.upload.path=file:${app.upload.base}
app.upload.url=/files/**
