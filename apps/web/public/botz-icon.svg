<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 머리 마스크: 흰 영역은 보이고, 캔들 모양은 도려냄(투명→검정 배경 비침) -->
    <mask id="eyeCut">
      <rect x="-248" y="-226" width="496" height="448" rx="92" fill="#ffffff"/>
      <!-- 왼쪽 캔들 -->
      <rect x="-109" y="-86" width="10" height="172" rx="5" fill="#000000"/>
      <rect x="-138" y="-52" width="68" height="104" rx="14" fill="#000000"/>
      <!-- 오른쪽 캔들 -->
      <rect x="99" y="-86" width="10" height="172" rx="5" fill="#000000"/>
      <rect x="70" y="-52" width="68" height="104" rx="14" fill="#000000"/>
    </mask>
  </defs>

  <!-- 배경: 완전 검정 라운드 스퀘어 -->
  <rect width="1024" height="1024" rx="224" ry="224" fill="#000000"/>

  <g transform="translate(512,540)" fill="#ffffff">
    <!-- 안테나 -->
    <rect x="-9" y="-300" width="18" height="78" rx="9"/>
    <circle cx="0" cy="-312" r="26"/>

    <!-- 양쪽 귀 -->
    <rect x="-322" y="-44" width="54" height="118" rx="22"/>
    <rect x="268" y="-44" width="54" height="118" rx="22"/>

    <!-- 머리 (캔들 눈은 마스크로 도려냄) -->
    <rect x="-248" y="-226" width="496" height="448" rx="92" mask="url(#eyeCut)"/>
  </g>
</svg>
